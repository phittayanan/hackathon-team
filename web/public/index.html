<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f2ff">
  <title>Q-Bot</title>
  <link rel="icon" href="/img/ubot/03-idle.jpeg" type="image/jpeg">
  <link rel="stylesheet" href="/css/app.css">
  <!-- Every module at once, instead of one import level after another. -->
  <link rel="modulepreload" href="/js/app.js">
  <link rel="modulepreload" href="/js/i18n.js">
  <link rel="modulepreload" href="/js/mascot.js">
  <link rel="modulepreload" href="/js/lines.js">
  <link rel="modulepreload" href="/js/data.js">
  <link rel="modulepreload" href="/js/scenes/index.js">
  <link rel="modulepreload" href="/js/scenes/payment.js">
  <link rel="modulepreload" href="/js/scenes/shopping.js">
  <link rel="modulepreload" href="/js/scenes/flight.js">
  <link rel="modulepreload" href="/js/scenes/training.js">
  <link rel="modulepreload" href="/js/scenes/generated.js">
  <link rel="modulepreload" href="/js/voice.js">
  <link rel="modulepreload" href="/js/log.js">
  <link rel="modulepreload" href="/js/api.js">
  <link rel="modulepreload" href="/js/stt.js">
  <link rel="modulepreload" href="/js/agent-link.js">
  <link rel="modulepreload" href="/js/feeds.js">
  <link rel="modulepreload" href="/js/agent-loop.js">
  <link rel="modulepreload" href="/js/brain.js">
  <link rel="modulepreload" href="/js/live-agent.js">
  <link rel="modulepreload" href="/js/agent-tools.js">
  <link rel="modulepreload" href="/js/genui.js">
  <link rel="modulepreload" href="/js/timing.js">
</head>
<body>
  <div class="phone" id="phone">
    <header class="statusbar"><span id="clock">9:41</span><div class="language-switch" role="group" aria-label="UI language"><button type="button" data-language="th" aria-pressed="true">Thai</button><button type="button" data-language="en" aria-pressed="false">Eng</button></div><span class="status-icons">●●● 5G ▮</span></header>
    <p class="notice" id="notice" data-testid="notice" role="status" hidden></p>

    <nav class="scene-toolbar" aria-label="Task navigation">
      <button class="home-btn" id="homeBtn" data-testid="home-btn" aria-label="Back to the agent home">⌂ หน้าหลัก · Home</button>
    </nav>
    <div class="workspace">
    <main class="home" id="home" aria-label="Agent home">
      <section class="intro" data-testid="intro">
        <h1>Q-Bot</h1>
      </section>
      <div class="mascot-wrap" id="mascotWrap">
        <img class="mascot" id="mascot" src="/img/ubot/03-idle.jpeg" alt="Q-Bot waiting">
      </div>
      <div class="wave" id="wave" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <p class="tap-hint" id="tapHint" data-testid="tap-hint">แตะหน้าจอเพื่อเปิดเสียง · Tap to turn on sound</p>
      <button class="secretary-button shopping-shortcut" id="catalogBtn" type="button" data-testid="shopify-catalog">เลือกสินค้า · Shopify</button>
      <button class="memory-entry" id="memoryEntry" type="button" data-testid="memory-entry" aria-label="agent จำอะไรไว้ · What I remember">agent จำอะไรไว้<small>What I remember</small></button>
    </main>

    <section class="stage" id="stage" aria-live="polite"></section>

    </div>

    <footer class="interaction-panel">
    <p class="subtitle" id="subtitle" aria-live="polite" tabindex="0" aria-label="ข้อความเสียง · Voice transcript"></p>
    <form class="composer" id="fallback" autocomplete="off" data-testid="composer">
      <input id="fallbackInput" name="text" placeholder="พิมพ์ที่นี่ · Type here" aria-label="Type what you want to say" enterkeyhint="send">
      <button class="send" type="submit" aria-label="Send">➤</button>
      <button class="mic" id="mic" type="button" aria-label="Hold to talk">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
      </button>
    </form>
    <p class="mic-hint" id="micHint">กดค้างที่ไมค์เพื่อพูด · Hold the mic to talk</p>
    </footer>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
